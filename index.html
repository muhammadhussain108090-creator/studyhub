<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub - Fixed Name</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f4f7fb}
.hidden{display:none!important}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2)}
.auth-card{width:100%;max-width:440px;background:white;border-radius:22px;padding:30px}
.primary-btn{width:100%;padding:13px;border-radius:11px;background:#667eea;color:white;font-weight:700;margin-bottom:10px}
.google-btn{width:100%;padding:13px;border-radius:11px;background:white;border:1px solid #ddd;font-weight:700;margin-bottom:10px}
.phone-btn{width:100%;padding:13px;border-radius:11px;background:#111827;color:white;font-weight:700;margin-bottom:10px}
#app{min-height:100vh}.topbar{height:70px;background:white;display:flex;justify-content:space-between;padding:0 25px;align-items:center}
.layout{display:flex}.sidebar{width:230px;background:white;padding:18px 12px}.nav-btn{width:100%;padding:13px;text-align:left;border-radius:10px}.nav-btn.active{background:#eef0ff;color:#5865d8}.main{flex:1;padding:28px}.page{display:none}.page.active{display:block}
.stat-card{background:white;padding:22px;border-radius:17px;margin-bottom:10px}.person-card{background:white;padding:15px;border-radius:15px;display:flex;justify-content:space-between;margin-bottom:10px}.small-btn{padding:9px 13px;background:#667eea;color:white;border-radius:9px}
.chat-box{position:fixed;right:20px;bottom:20px;width:370px;height:530px;background:white;border-radius:18px;box-shadow:0 15px 50px rgba(0,0,0,.22);display:flex;flex-direction:column}
</style>
</head>
<body>
<!-- SAME HTML AS BEFORE -->
<div id="authScreen"><div class="auth-card"><div style="text-align:center;font-size:34px;font-weight:800;color:#667eea">📚 StudyHub</div><div id="authMessage"></div>
<div id="loginForm"><input id="loginEmailInput" type="email" placeholder="Email"><input id="loginPasswordInput" type="password" placeholder="Password"><button class="primary-btn" onclick="loginEmail()">Login</button><button class="google-btn" onclick="loginGoogle()">Google</button><button class="phone-btn" onclick="showPhoneLogin()">Phone</button><div style="text-align:center;margin-top:15px"><button onclick="showSignup()" style="background:none;color:#667eea">Create account</button></div></div>
<div id="signupForm" class="hidden"><input id="signupName" placeholder="Full name"><select id="signupClass"><option value="">Select class</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option><option>Other</option></select><input id="signupEmailInput" type="email" placeholder="Email"><input id="signupPasswordInput" type="password" placeholder="Password"><input id="signupConfirmInput" type="password" placeholder="Confirm"><button class="primary-btn" onclick="signupEmail()">Create</button><button onclick="showLogin()">Back to Login</button></div>
<div id="phoneLoginForm" class="hidden"><input id="phoneLoginNumber" placeholder="+92..."><div id="recaptcha-login"></div><button class="phone-btn" onclick="sendPhoneLoginOTP()">Send OTP</button><div id="loginOtpArea" class="hidden"><input id="phoneLoginOtp" placeholder="OTP"><button onclick="verifyPhoneLogin()">Verify</button></div><button onclick="showLogin()">Back</button></div>
<div id="phoneSignupForm" class="hidden"><input id="phoneSignupName" placeholder="Name"><select id="phoneSignupClass"><option value="">Class</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select><input id="phoneSignupNumber" placeholder="+92..."><div id="recaptcha-signup"></div><button onclick="sendPhoneSignupOTP()">Send OTP</button><div id="signupOtpArea" class="hidden"><input id="phoneSignupOtp" placeholder="OTP"><button onclick="verifyPhoneSignup()">Verify</button></div><button onclick="showSignup()">Back</button></div>
</div></div>
<div id="app" class="hidden"><div class="topbar"><div>📚 StudyHub</div><div><span id="topAvatar"></span> <span id="topName">Student</span> <button onclick="logout()">Logout</button></div></div><div class="layout"><aside class="sidebar"><button class="nav-btn active" onclick="showPage('dashboard',this)">Dashboard</button><button class="nav-btn" onclick="showPage('friends',this)">Friends</button><button class="nav-btn" onclick="showPage('profile',this)">Profile</button><button class="nav-btn" onclick="showPage('tasks',this)">Tasks</button></aside><main class="main"><section id="dashboard" class="page active"><h1>Welcome</h1><div><div class="stat-card">Tasks: <strong id="taskCount">0</strong></div><div class="stat-card">Friends: <strong id="friendCount">0</strong></div></div></section><section id="tasks" class="page"><input id="taskInput" placeholder="Task"><button onclick="addTask()">Add</button><div id="taskList"></div></section><section id="friends" class="page"><input id="friendSearchInput" placeholder="Search"><button onclick="searchStudents()">Search</button><div id="searchResults"></div><div id="requestsList"></div><div id="friendsList"></div></section><section id="profile" class="page"><p>Name: <strong id="profileName">—</strong></p><p>Email: <strong id="profileEmail">—</strong></p><p>Phone: <strong id="profilePhone">—</strong></p><p>Class: <strong id="profileClass">—</strong></p><button onclick="editName()">Edit Name</button></section></main></div></div>
<div id="chatBox" class="chat-box hidden"><div style="background:#667eea;color:white;padding:15px;display:flex;justify-content:space-between"><strong id="chatName">Chat</strong><button onclick="closeChat()">✕</button></div><div id="messages" style="flex:1;overflow:auto;padding:15px"></div><form onsubmit="sendMessage(event)" style="display:flex;padding:10px"><input id="messageInput" placeholder="Type..." style="flex:1"><button type="submit">Send</button></form></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, GoogleAuthProvider, signInWithPopup, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEFgHDRoDFZ6IZco7iWloLvNCsL3SYckw",
  authDomain: "data-transfer-63111.firebaseapp.com",
  databaseURL: "https://data-transfer-63111-default-rtdb.firebaseio.com",
  projectId: "data-transfer-63111",
  storageBucket: "data-transfer-63111.firebasestorage.app",
  messagingSenderId: "1031425742783",
  appId: "1:1031425742783:web:5e8ff2207836f47c2cb30a",
  measurementId: "G-TV0RRNXWPD"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let loginConfirmationResult=null, signupConfirmationResult=null, loginRecaptcha=null, signupRecaptcha=null, currentChatUid=null, unsubscribeMessages=null;
function showMessage(m){document.getElementById("authMessage").innerHTML=m}
function hideAllAuthForms(){["loginForm","signupForm","phoneLoginForm","phoneSignupForm"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
window.showLogin=()=>{hideAllAuthForms();document.getElementById("loginForm").classList.remove("hidden")}
window.showSignup=()=>{hideAllAuthForms();document.getElementById("signupForm").classList.remove("hidden")}
window.showPhoneLogin=()=>{hideAllAuthForms();document.getElementById("phoneLoginForm").classList.remove("hidden")}
window.showPhoneSignup=()=>{hideAllAuthForms();document.getElementById("phoneSignupForm").classList.remove("hidden")}
window.signupEmail=async()=>{const name=document.getElementById("signupName").value.trim();const sClass=document.getElementById("signupClass").value;const email=document.getElementById("signupEmailInput").value.trim();const pass=document.getElementById("signupPasswordInput").value;const cred=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,name,nameLower:name.toLowerCase(),email,phone:"",class:sClass,createdAt:serverTimestamp()})}
window.loginEmail=async()=>{const email=document.getElementById("loginEmailInput").value.trim();const pass=document.getElementById("loginPasswordInput").value;await signInWithEmailAndPassword(auth,email,pass)}
async function googleAuth(){const p=new GoogleAuthProvider();const r=await signInWithPopup(auth,p);await ensureUserDocument(r.user)}
window.loginGoogle=googleAuth;window.signupGoogle=googleAuth;
function createLoginRecaptcha(){if(loginRecaptcha)return loginRecaptcha;loginRecaptcha=new RecaptchaVerifier(auth,"recaptcha-login",{size:"normal"});return loginRecaptcha}
function createSignupRecaptcha(){if(signupRecaptcha)return signupRecaptcha;signupRecaptcha=new RecaptchaVerifier(auth,"recaptcha-signup",{size:"normal"});return signupRecaptcha}
window.sendPhoneLoginOTP=async()=>{const phone=document.getElementById("phoneLoginNumber").value.trim();const v=createLoginRecaptcha();loginConfirmationResult=await signInWithPhoneNumber(auth,phone,v);document.getElementById("loginOtpArea").classList.remove("hidden")}
window.verifyPhoneLogin=async()=>{const code=document.getElementById("phoneLoginOtp").value.trim();const r=await loginConfirmationResult.confirm(code);await ensureUserDocument(r.user)}
window.sendPhoneSignupOTP=async()=>{const name=document.getElementById("phoneSignupName").value.trim();const sClass=document.getElementById("phoneSignupClass").value;const phone=document.getElementById("phoneSignupNumber").value.trim();window.pendingPhoneSignup={name,class:sClass,phone};const v=createSignupRecaptcha();signupConfirmationResult=await signInWithPhoneNumber(auth,phone,v);document.getElementById("signupOtpArea").classList.remove("hidden")}
window.verifyPhoneSignup=async()=>{const code=document.getElementById("phoneSignupOtp").value.trim();const r=await signupConfirmationResult.confirm(code);const p=window.pendingPhoneSignup;await updateProfile(r.user,{displayName:p.name});await setDoc(doc(db,"users",r.user.uid),{uid:r.user.uid,name:p.name,nameLower:p.name.toLowerCase(),email:"",phone:r.user.phoneNumber||p.phone,class:p.class,createdAt:serverTimestamp()})}
async function ensureUserDocument(u){const ref=doc(db,"users",u.uid);const s=await getDoc(ref);if(!s.exists()){const fallback=u.displayName|| (u.email?u.email.split('@')[0]:"Student");await setDoc(ref,{uid:u.uid,name:fallback,nameLower:fallback.toLowerCase(),email:u.email||"",phone:u.phoneNumber||"",class:"",createdAt:serverTimestamp()})}}
onAuthStateChanged(auth,async(user)=>{if(user){document.getElementById("authScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await ensureUserDocument(user);await loadProfile();}else{document.getElementById("authScreen").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}})
window.logout=async()=>{await signOut(auth)}
window.showPage=(id,btn)=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active")}

// ✅ FIXED
async function loadProfile(){
  const u=auth.currentUser; if(!u) return;
  const ref=doc(db,"users",u.uid);
  const snap=await getDoc(ref); if(!snap.exists()) return;
  const d=snap.data();
  let name=d.name;
  if(!name || name==="Student" || name.toLowerCase()==="student"){
    const inputName=prompt("Apna sahi naam likho (ek baar):", u.displayName||"");
    if(inputName && inputName.trim()!==""){
      name=inputName.trim();
      await setDoc(ref,{name:name,nameLower:name.toLowerCase()},{merge:true});
      try{await updateProfile(u,{displayName:name});}catch(e){}
    } else {
      name=u.displayName|| (u.email?u.email.split('@')[0]:"Student");
    }
  }
  document.getElementById("topName").textContent=name;
  document.getElementById("profileName").textContent=name;
  document.getElementById("profileEmail").textContent=d.email||u.email||"—";
  document.getElementById("profilePhone").textContent=d.phone||u.phoneNumber||"—";
  document.getElementById("profileClass").textContent=d.class||"—";
}
window.editName=async()=>{
  const newName=prompt("Naya naam likho:"); if(!newName) return;
  const ref=doc(db,"users",auth.currentUser.uid);
  await setDoc(ref,{name:newName.trim(),nameLower:newName.trim().toLowerCase()},{merge:true});
  await loadProfile(); alert("Updated!");
}
function taskKey(){return auth.currentUser?`studyhub_tasks_${auth.currentUser.uid}`:"studyhub_tasks"}
function getTasks(){try{return JSON.parse(localStorage.getItem(taskKey())||"[]")}catch{return[]}}
function saveTasks(t){localStorage.setItem(taskKey(),JSON.stringify(t))}
window.addTask=()=>{const txt=document.getElementById("taskInput").value.trim();if(!txt)return;const ts=getTasks();ts.push({text:txt});saveTasks(ts);document.getElementById("taskInput").value="";location.reload()}
window.searchStudents=async()=>{const term=document.getElementById("friendSearchInput").value.toLowerCase();const snap=await getDocs(collection(db,"users"));let html="";snap.forEach(d=>{if(d.id===auth.currentUser.uid)return;const data=d.data();if((data.nameLower||"").includes(term)) html+=`<div>${data.name} <button onclick="sendFriendRequest('${d.id}')">Add</button> <button onclick="openChat('${d.id}')">Chat</button></div>`});document.getElementById("searchResults").innerHTML=html}
window.sendFriendRequest=async(toUid)=>{await setDoc(doc(db,"friendRequests",`${auth.currentUser.uid}_${toUid}`),{fromUid:auth.currentUser.uid,toUid,status:"pending",createdAt:serverTimestamp()});alert("Sent")}
window.openChat=async(uid)=>{currentChatUid=uid;document.getElementById("chatBox").classList.remove("hidden");const chatId=[auth.currentUser.uid,uid].sort().join("_");const q=query(collection(db,"chats",chatId,"messages"),orderBy("createdAt"));if(unsubscribeMessages)unsubscribeMessages();unsubscribeMessages=onSnapshot(q,snap=>{const box=document.getElementById("messages");box.innerHTML="";snap.forEach(d=>{const m=d.data();const div=document.createElement("div");div.textContent=m.text;box.appendChild(div)})})}
window.closeChat=()=>{document.getElementById("chatBox").classList.add("hidden")}
window.sendMessage=async(e)=>{e.preventDefault();const text=document.getElementById("messageInput").value.trim();if(!text||!currentChatUid)return;const chatId=[auth.currentUser.uid,currentChatUid].sort().join("_");await addDoc(collection(db,"chats",chatId,"messages"),{fromUid:auth.currentUser.uid,toUid:currentChatUid,text,createdAt:serverTimestamp()});document.getElementById("messageInput").value=""}
</script>
</body>
</html>
